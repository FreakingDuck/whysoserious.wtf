<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorisse</title>
<style>
/* Lorisse's shared stylesheet: the design's tokens (dark on :root, light below) and the components the tools share.
   Its source copy lives in the owner's Lorisse repository under page/lorisse.css; a tool copies it whole, never edits it.
   Roles: blue = sure / done, orange = busy / now, pink = trouble, yellow = careful; no web font loaded, the fallbacks show.
   Every colour is a token of the three blocks below (:root, the light media query, [data-theme="light"]): no colour literal
   anywhere else in a tool's page, method/gate/check_colours.ps1 fails on one (since 2026-11-09). */
:root {
  color-scheme: dark;

  /* surfaces: line-2 is the outline of what is empty or waiting */
  --cb-bg: #07111a;
  --cb-surface: #0d1a26;
  --cb-surface-2: #13222f;
  --cb-line: #1a2b3b;
  --cb-line-2: #2f4558;

  /* ink */
  --cb-ink: #e6f1fa;
  --cb-ink-2: #9fb4c6;
  --cb-ink-3: #6a8296;
  --cb-on-accent: #07111a;
  --cb-on-accent-dim: rgba(7, 17, 26, .72);
  --cb-on-accent-faint: rgba(7, 17, 26, .4);
  --cb-on-yellow: #0f1a00;

  /* the eye's four */
  --cb-blue: #4cc9f0;
  --cb-orange: #ffb703;
  --cb-orange-hi: #ffcb47;
  --cb-pink: #ff5c8a;
  --cb-yellow: #b8f35d;
  --cb-blue-soft: rgba(76, 201, 240, .14);
  --cb-orange-soft: rgba(255, 183, 3, .14);
  --cb-pink-soft: rgba(255, 92, 138, .14);
  --cb-yellow-soft: rgba(184, 243, 93, .14);
  --cb-blue-glow: rgba(76, 201, 240, .45);
  --cb-orange-glow: rgba(255, 183, 3, .5);
  --cb-pink-glow: rgba(255, 92, 138, .45);
  --cb-blue-edge: rgba(76, 201, 240, .45);
  --cb-orange-edge: rgba(255, 183, 3, .5);
  --cb-pink-edge: rgba(255, 92, 138, .5);
  --cb-yellow-edge: rgba(184, 243, 93, .5);

  /* the verdict green: OK as a pass / fail word to a person (the owner, 2026-11-05); blue stays selection and primary, the yellow-green a warning */
  --cb-green: #3ddc97;
  --cb-green-soft: rgba(61, 220, 151, .14);
  --cb-green-edge: rgba(61, 220, 151, .5);

  /* commit bands */
  --cb-band-ok: #3fa9d0;
  --cb-band-late: #e0b000;
  --cb-band-very-late: #e2621a;
  --cb-band-too-much: #d9529a;
  --cb-band-weekend: #1f2d3a;

  /* chart tiers: colour in a spend chart means the tier only */
  --cb-tier-1: #bb8100;
  --cb-tier-2: #1fa2cc;
  --cb-tier-3: #f0507f;

  /* fonts */
  --cb-font-app: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cb-font-note: "Literata", Georgia, "Times New Roman", serif;
  --cb-font-mono: "B612 Mono", ui-monospace, Consolas, "Courier New", monospace;

  /* type scale */
  --cb-fs-xs: 0.75rem;
  --cb-fs-sm: 0.875rem;
  --cb-fs-md: 1rem;
  --cb-fs-lg: 1.25rem;
  --cb-fs-xl: 1.75rem;
  --cb-fs-readout: 2.875rem;
  --cb-fs-note: 1.0625rem;

  /* weights */
  --cb-fw-regular: 400;
  --cb-fw-medium: 500;
  --cb-fw-semibold: 600;
  --cb-fw-bold: 700;
  --cb-fw-heavy: 800;

  /* line heights */
  --cb-lh-tight: 1.05;
  --cb-lh-snug: 1.2;
  --cb-lh-body: 1.45;
  --cb-lh-note: 1.5;

  /* tracking */
  --cb-track-tight: -0.01em;
  --cb-track-readout: -0.02em;
  --cb-track-caps: 0.09em;

  /* spacing, 4 px steps */
  --cb-space-1: 4px;
  --cb-space-2: 8px;
  --cb-space-3: 12px;
  --cb-space-4: 16px;
  --cb-space-5: 20px;
  --cb-space-6: 24px;
  --cb-space-7: 28px;
  --cb-space-8: 32px;

  /* radii */
  --cb-radius-sm: 8px;
  --cb-radius-md: 12px;
  --cb-radius-card: 14px;
  --cb-radius-pill: 999px;

  /* borders */
  --cb-border: 1px;
  --cb-border-chip: 1.5px;

  /* shadows: flat; a card is its line, a pop keeps one shadow to lift it off the page */
  --cb-shadow-card: 0 0 0 1px var(--cb-line);
  --cb-shadow-pop: 0 0 0 1px var(--cb-line-2), 0 24px 48px -16px rgba(0, 0, 0, .9);
  --cb-shadow-go: none;
  --cb-scrim: rgba(0, 0, 0, .6);
  --cb-shadow-knob: 0 1px 3px rgba(0, 0, 0, .25);
  --cb-shadow-seg: 0 0 0 1px var(--cb-line), 0 2px 6px -2px rgba(0, 0, 0, .5);

  /* no glow at rest; agent-mark and quarter are the caption glyphs' fills */
  --cb-glow: none;
  --cb-agent-mark: conic-gradient(from 200deg, var(--cb-blue), var(--cb-orange), var(--cb-blue));
  --cb-go-fill: var(--cb-orange);
  --cb-quarter: conic-gradient(from -45deg, var(--cb-orange) 0 90deg, var(--cb-line-2) 0);

  /* the eye: a dark core in both themes, its inner light, an unused quarter's outline */
  --cb-eye-core: #03080d;
  --cb-eye-light: rgba(255, 255, 255, .75);
  --cb-eye-rim: rgba(255, 255, 255, .45);
  --cb-eye-off: var(--cb-line-2);

  /* print: the paper, in both themes */
  --cb-print-bg: #ffffff;

  /* motion */
  --cb-dur-fast: 150ms;
  --cb-dur-normal: 250ms;
  --cb-ease: cubic-bezier(.2, .7, .2, 1);

  /* focus */
  --cb-focus-ring: 2px solid var(--cb-blue);
  --cb-focus-offset: 2px;
  --cb-focus-soft: 0 0 0 3px var(--cb-blue-soft);

  /* z-index */
  --cb-z-sticky: 100;
  --cb-z-overlay: 200;
  --cb-z-modal: 300;
  --cb-z-toast: 400;
  --cb-z-tooltip: 500;

  /* touch */
  --cb-touch: 44px;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --cb-bg: #ebe7e0;
    --cb-surface: #e3dfd7;
    --cb-surface-2: #d9d4cb;
    --cb-line: #d0cabf;
    --cb-line-2: #9a9488;
    --cb-ink: #1c2733;
    --cb-ink-2: #46525e;
    --cb-ink-3: #525c67;
    --cb-on-accent: #ffffff;
    --cb-on-accent-dim: rgba(255, 255, 255, .72);
    --cb-on-accent-faint: rgba(255, 255, 255, .4);
    --cb-blue: #006488;
    --cb-orange: #824e00;
    --cb-orange-hi: #9a5c00;
    --cb-pink: #b5124f;
    --cb-yellow: #3e6300;
    --cb-blue-soft: rgba(0, 100, 136, .10);
    --cb-orange-soft: rgba(130, 78, 0, .10);
    --cb-pink-soft: rgba(181, 18, 79, .09);
    --cb-yellow-soft: rgba(62, 99, 0, .10);
    --cb-blue-glow: rgba(0, 100, 136, .45);
    --cb-orange-glow: rgba(130, 78, 0, .5);
    --cb-pink-glow: rgba(181, 18, 79, .45);
    --cb-blue-edge: rgba(0, 100, 136, .5);
    --cb-orange-edge: rgba(130, 78, 0, .5);
    --cb-pink-edge: rgba(181, 18, 79, .5);
    --cb-yellow-edge: rgba(62, 99, 0, .55);
    --cb-green: #00704a;
    --cb-green-soft: rgba(0, 112, 74, .10);
    --cb-green-edge: rgba(0, 112, 74, .5);
    --cb-band-ok: #1f86b0;
    --cb-band-late: #c49a00;
    --cb-band-very-late: #d2520a;
    --cb-band-too-much: #b8186a;
    --cb-band-weekend: #cfc9be;
    --cb-tier-1: #9a5c00;
    --cb-tier-2: #00739e;
    --cb-tier-3: #c2185b;
    --cb-shadow-pop: 0 0 0 1px var(--cb-line-2), 0 24px 48px -16px rgba(28, 39, 51, .28);
    --cb-scrim: rgba(28, 39, 51, .38);
    --cb-shadow-seg: 0 0 0 1px var(--cb-line), 0 2px 6px -2px rgba(28, 39, 51, .18);
  }
}

:root[data-theme="light"] {
  color-scheme: light;
  --cb-bg: #ebe7e0;
  --cb-surface: #e3dfd7;
  --cb-surface-2: #d9d4cb;
  --cb-line: #d0cabf;
  --cb-line-2: #9a9488;
  --cb-ink: #1c2733;
  --cb-ink-2: #46525e;
  --cb-ink-3: #525c67;
  --cb-on-accent: #ffffff;
  --cb-on-accent-dim: rgba(255, 255, 255, .72);
  --cb-on-accent-faint: rgba(255, 255, 255, .4);
  --cb-blue: #006488;
  --cb-orange: #824e00;
  --cb-orange-hi: #9a5c00;
  --cb-pink: #b5124f;
  --cb-yellow: #3e6300;
  --cb-blue-soft: rgba(0, 100, 136, .10);
  --cb-orange-soft: rgba(130, 78, 0, .10);
  --cb-pink-soft: rgba(181, 18, 79, .09);
  --cb-yellow-soft: rgba(62, 99, 0, .10);
  --cb-blue-glow: rgba(0, 100, 136, .45);
  --cb-orange-glow: rgba(130, 78, 0, .5);
  --cb-pink-glow: rgba(181, 18, 79, .45);
  --cb-blue-edge: rgba(0, 100, 136, .5);
  --cb-orange-edge: rgba(130, 78, 0, .5);
  --cb-pink-edge: rgba(181, 18, 79, .5);
  --cb-yellow-edge: rgba(62, 99, 0, .55);
  --cb-green: #00704a;
  --cb-green-soft: rgba(0, 112, 74, .10);
  --cb-green-edge: rgba(0, 112, 74, .5);
  --cb-band-ok: #1f86b0;
  --cb-band-late: #c49a00;
  --cb-band-very-late: #d2520a;
  --cb-band-too-much: #b8186a;
  --cb-band-weekend: #cfc9be;
  --cb-tier-1: #9a5c00;
  --cb-tier-2: #00739e;
  --cb-tier-3: #c2185b;
  --cb-shadow-pop: 0 0 0 1px var(--cb-line-2), 0 24px 48px -16px rgba(28, 39, 51, .28);
  --cb-scrim: rgba(28, 39, 51, .38);
  --cb-shadow-seg: 0 0 0 1px var(--cb-line), 0 2px 6px -2px rgba(28, 39, 51, .18);
}

/* base */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cb-bg);
  color: var(--cb-ink);
  font: var(--cb-fw-regular) var(--cb-fs-md)/var(--cb-lh-body) var(--cb-font-app);
  -webkit-font-smoothing: antialiased;
}

/* typography roles */
.cb-t-title { margin: 0; font: var(--cb-fw-heavy) var(--cb-fs-xl)/var(--cb-lh-snug) var(--cb-font-app); letter-spacing: var(--cb-track-tight); }
.cb-t-title--sm { font-size: var(--cb-fs-lg); }
.cb-t-section { margin: 0; font: var(--cb-fw-semibold) var(--cb-fs-xs)/1 var(--cb-font-app); letter-spacing: var(--cb-track-caps); text-transform: uppercase; color: var(--cb-ink-3); }
.cb-t-body { margin: 0; font: var(--cb-fw-regular) var(--cb-fs-md)/var(--cb-lh-body) var(--cb-font-app); color: var(--cb-ink); }
.cb-t-hint { margin: 0; font: var(--cb-fw-regular) var(--cb-fs-sm)/var(--cb-lh-body) var(--cb-font-app); color: var(--cb-ink-3); }
.cb-t-mono { font: var(--cb-fw-regular) var(--cb-fs-sm)/var(--cb-lh-body) var(--cb-font-mono); color: var(--cb-ink-2); }

/* chips */
.cb-chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 10px;
  border: var(--cb-border-chip) solid var(--cb-line-2); border-radius: var(--cb-radius-pill); background: transparent;
  color: var(--cb-ink-2); font: var(--cb-fw-bold) var(--cb-fs-xs)/1.6 var(--cb-font-app); letter-spacing: .06em; text-transform: uppercase;
  white-space: nowrap;
}
.cb-chip--done { color: var(--cb-blue); border-color: var(--cb-blue); }
.cb-chip--next { color: var(--cb-orange); border-color: var(--cb-orange); }
.cb-chip--orange { color: var(--cb-orange); border-color: var(--cb-orange); background: var(--cb-orange-soft); }
.cb-chip--quiet { color: var(--cb-ink-2); border-color: transparent; background: var(--cb-surface-2); }

/* count */
.cb-count {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px;
  box-sizing: border-box; border: var(--cb-border-chip) solid var(--cb-line-2); border-radius: var(--cb-radius-pill); background: transparent; color: var(--cb-ink-2);
  font: var(--cb-fw-bold) 0.6875rem/1 var(--cb-font-mono);
}
.cb-count--next { border-color: var(--cb-orange); color: var(--cb-orange); }
.cb-count--quiet { border-color: var(--cb-line); color: var(--cb-ink-3); }

/* progress */
.cb-bar { display: grid; gap: 6px; }
.cb-bar-head { display: flex; justify-content: space-between; gap: var(--cb-space-3); font-size: var(--cb-fs-sm); color: var(--cb-ink-2); }
.cb-bar-head b { font: var(--cb-fw-regular) var(--cb-fs-sm)/1.4 var(--cb-font-mono); color: var(--cb-ink); }
.cb-bar-track { height: 8px; border-radius: var(--cb-radius-pill); background: var(--cb-surface-2); overflow: hidden; }
.cb-bar-fill { height: 100%; width: var(--value, 0%); border-radius: inherit; background: var(--cb-blue); transition: width var(--cb-dur-normal) var(--cb-ease); }
.cb-bar--next .cb-bar-fill { background: var(--cb-go-fill); }
.cb-bar--stack .cb-bar-track { display: flex; gap: 2px; height: 12px; }
.cb-bar-part { height: 100%; width: var(--value, 0%); flex: none; background: var(--cb-key, var(--cb-ink-3)); }

/* cards */
.cb-card { position: relative; padding: 22px; border: var(--cb-border) solid var(--cb-line); border-radius: var(--cb-radius-card); background: var(--cb-surface); color: var(--cb-ink); box-shadow: var(--cb-shadow-card); }
.cb-card--hot { border-color: var(--cb-orange-edge); box-shadow: none; }
.cb-card--quiet { background: transparent; box-shadow: none; border-style: dashed; border-color: var(--cb-line-2); }

/* group: a heading with a count over its cards */
.cb-group { display: grid; gap: var(--cb-space-3); min-width: 0; }
.cb-group-h { display: flex; align-items: center; gap: var(--cb-space-2); min-height: 28px; margin: 0; font: var(--cb-fw-semibold) var(--cb-fs-xs)/1 var(--cb-font-app); letter-spacing: var(--cb-track-caps); text-transform: uppercase; color: var(--cb-ink-3); }
.cb-group-h .cb-count { letter-spacing: 0; }

/* stat tile */
.cb-stat { display: grid; align-content: start; gap: 4px; min-width: 0; padding: 14px 16px; border: var(--cb-border) solid var(--cb-line); border-radius: var(--cb-radius-md); background: var(--cb-surface); }
.cb-stat-value { font: var(--cb-fw-bold) var(--cb-fs-xl)/var(--cb-lh-tight) var(--cb-font-mono); letter-spacing: var(--cb-track-readout); color: var(--cb-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cb-stat-label { font-size: var(--cb-fs-sm); color: var(--cb-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* chart (svg) */
.cb-chart { display: block; width: 100%; height: auto; overflow: visible; }
.cb-chart text { font: 10.5px var(--cb-font-mono); fill: var(--cb-ink-3); }
.cb-chart-grid { stroke: var(--cb-line); stroke-width: 1; }
.cb-chart-base { stroke: var(--cb-line-2); stroke-width: 1; }
.cb-chart-seg { fill: var(--cb-key, var(--cb-ink-3)); }
.cb-chart .cb-chart-last { font: var(--cb-fw-bold) 13px var(--cb-font-app); fill: var(--cb-ink); }

/* table, the non-visual view */
.cb-more { margin-top: var(--cb-space-4); font-size: var(--cb-fs-sm); }
.cb-more > summary { min-height: var(--cb-touch); display: flex; align-items: center; color: var(--cb-ink-2); font-weight: var(--cb-fw-semibold); cursor: pointer; }
.cb-table-wrap { max-width: 100%; overflow-x: auto; }
.cb-table { width: 100%; border-collapse: collapse; font: var(--cb-fs-sm)/1.4 var(--cb-font-mono); color: var(--cb-ink); }
.cb-table th { position: sticky; top: 0; padding: 6px 8px; background: var(--cb-surface); border-bottom: 1px solid var(--cb-line-2); font: var(--cb-fw-semibold) var(--cb-fs-xs)/1.2 var(--cb-font-app); color: var(--cb-ink-2); text-align: left; white-space: nowrap; }
.cb-table td { padding: 5px 8px; border-bottom: 1px solid var(--cb-line); white-space: nowrap; }
.cb-table .is-num { text-align: right; font-variant-numeric: tabular-nums; }
.cb-table tbody tr:hover { background: var(--cb-surface-2); }

/* tooltip, floating */
.cb-tip {
  position: absolute; left: 50%; bottom: calc(100% + 8px); z-index: var(--cb-z-tooltip); padding: 6px 10px; border-radius: var(--cb-radius-sm);
  background: var(--cb-ink); color: var(--cb-bg); font: var(--cb-fw-semibold) var(--cb-fs-xs)/1.3 var(--cb-font-app); white-space: nowrap;
  opacity: 0; pointer-events: none; transform: translate(-50%, 4px); transition: opacity var(--cb-dur-fast), transform var(--cb-dur-fast);
}
.cb-tip--float { position: fixed; left: 0; top: 0; bottom: auto; max-width: 280px; white-space: pre-line; opacity: 1; transform: none; transition: none; }
.cb-tip--float[hidden] { display: none; }
</style>
<style>
/* The project page as a dashboard (2026-11-19, the owner's canvas): the classes this page adds over the shared
   stylesheet (pv-). Tokens are used as they are; no colour is written here. */
.pv { max-width: 1180px; margin: 0 auto; padding: var(--cb-space-6) var(--cb-space-6) var(--cb-space-8); display: grid; gap: var(--cb-space-3); }
.pv h2, .pv h3 { margin: 0; }
[data-lx-path] { cursor: pointer; }
[data-lx-path]:hover { text-decoration: underline; text-underline-offset: 2px; }
.pv-mono { font-family: var(--cb-font-mono); }

/* the head: the project's name and the gate in one line, the branch and the hour at the right */
.pv-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--cb-space-1) 14px; }
.pv-top h1 { font: var(--cb-fw-semibold) 1.375rem/1.2 var(--cb-font-app); color: var(--cb-ink); }
/* Lorisse's eye before the name, the extension's mark drawn inline: its two lit quarters and its pupil in the ink, its
   two unused quarters in the eye's own token; both follow the theme */
.pv-eye { flex: none; align-self: center; width: 1.05rem; height: 1.05rem; margin-right: -6px; color: var(--cb-ink); }
.pv-eye .pv-eye-on { stroke: currentColor; }
.pv-eye .pv-eye-off { stroke: var(--cb-eye-off); }
.pv-eye .pv-eye-pupil { fill: currentColor; }
.pv-gate { font-size: 13px; color: var(--cb-ink-2); }
.pv-gate.is-green { color: var(--cb-green); }
.pv-gate.is-red { color: var(--cb-pink); }
.pv-grow { flex: 1; }
.pv-meta { font-size: var(--cb-fs-xs); color: var(--cb-ink-2); }
.pv-refresh { align-self: center; display: inline-flex; margin-left: -6px; padding: 3px; border: 0; border-radius: 4px; background: transparent; color: var(--cb-ink-2); cursor: pointer; }
.pv-refresh[hidden] { display: none; }
.pv-refresh:hover { color: var(--cb-ink); background: var(--cb-surface-2); }
.pv-refresh:focus-visible { outline: var(--cb-focus-ring); outline-offset: var(--cb-focus-offset); }
.pv-refresh svg { display: block; width: 14px; height: 14px; }

/* the tabs: Dashboard, Parts, Growth and tokens; the chosen one in the page's URL */
.pv-tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--cb-line); overflow-x: auto; }
.pv-tab { min-height: 36px; padding: 8px 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--cb-ink-2); font: var(--cb-fw-regular) 13.5px/1.4 var(--cb-font-app); white-space: nowrap; cursor: pointer; }
.pv-tab:hover { color: var(--cb-ink); }
.pv-tab[aria-selected="true"] { color: var(--cb-ink); border-bottom-color: var(--cb-blue); font-weight: var(--cb-fw-semibold); }
.pv-tab:focus-visible { outline: var(--cb-focus-ring); outline-offset: var(--cb-focus-offset); }
.pv-panel { display: grid; gap: var(--cb-space-3); min-width: 0; }
.pv-panel[hidden] { display: none; }

/* a box of the dashboard and its caption */
.pv-box { min-width: 0; padding: var(--cb-space-3) 0; border: 1px solid var(--cb-line); border-radius: 6px; background: var(--cb-surface); display: flex; flex-direction: column; }
.pv-cap { margin: 0; padding: 0 var(--cb-space-4) var(--cb-space-2); font: var(--cb-fw-regular) 11px/1.3 var(--cb-font-app); letter-spacing: .08em; text-transform: uppercase; color: var(--cb-ink-2); }
.pv-cap--next { padding-top: var(--cb-space-3); }
.pv-list { list-style: none; margin: 0; padding: 0; }
.pv-row2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: var(--cb-space-3); align-items: stretch; }
.pv-hint { margin: 0; font-size: var(--cb-fs-xs); color: var(--cb-ink-3); }

/* your move: a verb, the line and its detail, the time */
.pv-mv { display: flex; align-items: center; gap: var(--cb-space-3); min-height: 44px; padding: var(--cb-space-1) var(--cb-space-4); font-size: var(--cb-fs-sm); color: var(--cb-ink); }
.pv-verb { flex: none; width: 58px; padding: 3px 0; border-radius: 4px; background: var(--cb-blue-soft); color: var(--cb-blue); font: var(--cb-fw-semibold) var(--cb-fs-xs)/1.3 var(--cb-font-app); text-align: center; }
.pv-verb--other { background: var(--cb-surface-2); color: var(--cb-ink-2); }
.pv-verb--none { background: transparent; }
.pv-nm { flex: 1; min-width: 0; }
.pv-sub { display: block; font-size: var(--cb-fs-xs); color: var(--cb-ink-2); }
.pv-t { flex: none; font-size: var(--cb-fs-xs); color: var(--cb-ink-2); white-space: nowrap; }

/* in flight, last merged */
.pv-fl { display: flex; align-items: baseline; gap: var(--cb-space-2); padding: var(--cb-space-1) var(--cb-space-4); font-size: 13px; color: var(--cb-ink); }
.pv-d { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--cb-orange); align-self: center; }
.pv-d--green { background: var(--cb-green); }
.pv-d--pink { background: var(--cb-pink); }
.pv-d--blue { background: var(--cb-blue); }
.pv-q { color: var(--cb-ink-2); font-size: 12.5px; }

/* the pages to read: one line */
.pv-read { flex-direction: row; flex-wrap: wrap; align-items: center; gap: var(--cb-space-2) 14px; padding: 10px var(--cb-space-4); }
.pv-read-n { font: var(--cb-fw-semibold) 1.25rem/1.2 var(--cb-font-app); color: var(--cb-ink); }
.pv-read-w { font-size: 13px; color: var(--cb-ink); }
.pv-read-bar { flex: 1 1 120px; height: 10px; border-radius: 5px; background: var(--cb-line); overflow: hidden; display: flex; }
.pv-read-fill { width: 0; background: var(--cb-orange); }
.pv-o { font-size: 12.5px; color: var(--cb-orange); }

/* the pick: the road file's pages, in its order, one line each; five left shown, the rest behind "n more" */
.pv-pick { padding: 10px 0 8px; }
.pv-pk { display: flex; align-items: center; gap: 10px; min-height: 24px; padding: 0 var(--cb-space-4); font-size: 13px; color: var(--cb-ink); }
.pv-pk .pv-k, .pv-pk .pv-ic { flex: none; }
.pv-pk-f { flex: none; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-pk-w { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--cb-fs-xs); color: var(--cb-ink-2); }
.pv-pk-w.is-o { color: var(--cb-orange); }
.pv-pk.is-done .pv-pk-f, .pv-pk.is-done .pv-pk-w { color: var(--cb-ink-3); }
.pv-pick-end { display: flex; gap: 14px; align-items: baseline; padding: 4px var(--cb-space-4) 0; }
/* the pick as one list (the canvas): a move or a page a line, its verb in the small box */
.pv-pick .pv-pk { min-height: 30px; }
.pv-pk-l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-readline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; padding: 8px var(--cb-space-4) 0; font-size: 12.5px; color: var(--cb-ink); }

/* the parts, where each one stands */
.pv-gridwrap { max-width: 100%; overflow-x: auto; }
.pv-grid { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px; color: var(--cb-ink); }
.pv-grid th { padding: 0 var(--cb-space-1) 6px; font: var(--cb-fw-regular) 11px/1.3 var(--cb-font-app); color: var(--cb-ink-2); text-align: center; white-space: nowrap; }
.pv-grid td { height: 26px; padding: 0 var(--cb-space-1); border-top: 1px solid var(--cb-surface-2); text-align: center; white-space: nowrap; }
.pv-grid .l { text-align: left; padding-left: var(--cb-space-4); }
.pv-grid td.s { color: var(--cb-ink-2); font-size: var(--cb-fs-xs); text-align: left; }
.pv-grid td.n { font-variant-numeric: tabular-nums; }
.pv-grid td.z { color: var(--cb-ink-3); }
.pv-grid .sep { border-left: 1px solid var(--cb-line); }
.pv-grid tr.is-kid .l { padding-left: 34px; }
.pv-grid tr.is-quiet td { color: var(--cb-ink-3); }
.pv-grid tr:hover td { background: var(--cb-surface-2); }
.pv-pbtn { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.pv-pbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
.pv-pbtn:focus-visible, .pv-link:focus-visible, .pv-more:focus-visible, .pv-chip:focus-visible, .pv-kind:focus-visible, .pv-pr:focus-visible { outline: var(--cb-focus-ring); outline-offset: var(--cb-focus-offset); }

/* the side bar's looks: a dot in its state's colour, its icons, a ring for a stage */
.c-ok { --pv-c: var(--cb-green); }
.c-read { --pv-c: var(--cb-blue); }
.c-changed { --pv-c: var(--cb-orange); }
.c-never { --pv-c: var(--cb-ink-3); }
.c-rework { --pv-c: var(--cb-pink); }
.c-none { --pv-c: var(--cb-line-2); }
.pv-k { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; background: var(--pv-c, var(--cb-ink-3)); }
.pv-k--ring { background: transparent; border: 1.5px solid var(--cb-line-2); }
.pv-k--fill { background: var(--cb-blue); }
.pv-k--dash { height: 0; border-radius: 0; background: none; border-top: 1.5px solid var(--cb-line-2); }
.pv-k--none { background: transparent; border: 1.5px solid var(--pv-c); }
.pv-ic { display: inline-block; width: 14px; height: 14px; vertical-align: middle; color: var(--pv-c, var(--cb-ink-2)); }
.pv-ic svg { display: block; width: 14px; height: 14px; }
.pv-ic .pv-ic-cut { stroke: var(--cb-surface); }
.pv-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: var(--cb-space-2) var(--cb-space-4) 0; font-size: 11.5px; color: var(--cb-ink-2); }
.pv-key > span { display: inline-flex; align-items: center; gap: 5px; }
.pv-key-end { margin-left: auto; }

/* parts: a list on the left, the one part on the right */
.pv-split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: var(--cb-space-3); align-items: start; }
.pv-plist { padding: var(--cb-space-1) 0; }
.pv-grp { margin: 0; padding: 10px 14px 2px; font: var(--cb-fw-regular) 11px/1.3 var(--cb-font-app); color: var(--cb-ink-2); }
.pv-pr { display: flex; width: 100%; align-items: center; gap: var(--cb-space-2); min-height: 30px; padding: 0 14px; border: 0; background: transparent; color: var(--cb-ink); font: 13px/1.3 var(--cb-font-app); text-align: left; cursor: pointer; }
.pv-pr:hover { background: var(--cb-surface-2); }
.pv-pr[aria-current="true"] { background: var(--cb-surface-2); box-shadow: inset 2px 0 0 var(--cb-blue); }
.pv-pr .pv-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-c { flex: none; font-size: 11.5px; color: var(--cb-ink-2); }
.pv-c.is-o { color: var(--cb-orange); }
.pv-pr.is-quiet { color: var(--cb-ink-3); }
.pv-yd { flex: none; width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.pv-yd.is-on { background: var(--cb-orange); }
/* the one next thing for him, first in the part chosen */
.pv-you { margin: 0 0 var(--cb-space-3); padding: 8px 12px; border-radius: 6px; background: var(--cb-surface-2); font-size: 14px; line-height: 1.4; color: var(--cb-ink); }
.pv-you b { font-weight: var(--cb-fw-semibold); }
.pv-you.is-none { color: var(--cb-ink-2); }
.pv-you-w { font-size: 12.5px; color: var(--cb-ink-2); }
.pv-one { padding: var(--cb-space-4) var(--cb-space-5); }
.pv-one-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--cb-space-1) var(--cb-space-3); }
.pv-one-h h2 { font: var(--cb-fw-semibold) 1.1875rem/1.2 var(--cb-font-app); color: var(--cb-ink); }
.pv-what { margin: 2px 0 0; font-size: 13px; color: var(--cb-ink-2); }
.pv-six { list-style: none; margin: 0; padding: var(--cb-space-4) 0 var(--cb-space-1); display: flex; }
.pv-six li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: var(--cb-fs-xs); color: var(--cb-ink-2); }
.pv-six .pv-k { width: 14px; height: 14px; }
.pv-six .pv-ic, .pv-six .pv-ic svg { width: 16px; height: 16px; }
.pv-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: var(--cb-space-7); }
.pv-two > div { min-width: 0; }
.pv-cap2 { margin: 0; padding: var(--cb-space-3) 0 6px; font: var(--cb-fw-regular) 11px/1.3 var(--cb-font-app); letter-spacing: .08em; text-transform: uppercase; color: var(--cb-ink-2); }
.pv-ln { display: flex; align-items: baseline; gap: 10px; min-height: 26px; font-size: 13px; color: var(--cb-ink); }
.pv-ln .pv-nm { overflow-wrap: anywhere; }
.pv-m { font-size: var(--cb-fs-xs); color: var(--cb-ink-2); white-space: nowrap; }
.pv-m.is-ok { color: var(--cb-green); }
.pv-m.is-read { color: var(--cb-blue); }
.pv-m.is-o { color: var(--cb-orange); }
.pv-m.is-pink { color: var(--cb-pink); }
.pv-m.is-grey { color: var(--cb-ink-3); }
.pv-m.pv-sub { white-space: normal; }
.pv-id { flex: none; width: 38px; font-size: var(--cb-fs-xs); color: var(--cb-ink-2); }
.pv-para { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--cb-ink-2); }
.pv-link, .pv-more { padding: 0; border: 0; background: transparent; color: var(--cb-blue); font: 12px/1.4 var(--cb-font-app); cursor: pointer; }
.pv-link:hover, .pv-more:hover { text-decoration: underline; }
.pv-grey { margin: var(--cb-space-3) 0 0; font-size: var(--cb-fs-xs); color: var(--cb-ink-3); }

/* growth and tokens: a side with the figures and the legend, the chart beside it */
.pv-gt { flex-direction: row; gap: 22px; padding: 14px 18px; }
.pv-side { flex: none; width: 250px; display: flex; flex-direction: column; gap: var(--cb-space-2); }
.pv-side .pv-cap { padding: 0; }
.pv-fig { display: flex; align-items: baseline; gap: var(--cb-space-2); }
.pv-big { font: var(--cb-fw-semibold) 1.5rem/1.1 var(--cb-font-app); color: var(--cb-ink); font-variant-numeric: tabular-nums; }
.pv-big--s { font-size: 1.125rem; }
.pv-lbl { font-size: var(--cb-fs-xs); color: var(--cb-ink-2); }
.pv-kinds { list-style: none; margin: 0; padding: 6px 0 0; display: grid; gap: 3px; }
.pv-kind { display: flex; width: 100%; align-items: center; gap: 7px; min-height: 24px; padding: 0 4px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--cb-ink); font: 12.5px/1.3 var(--cb-font-app); text-align: left; cursor: pointer; }
.pv-kind:hover { border-color: var(--cb-line-2); }
.pv-kind b { margin-left: auto; font-weight: var(--cb-fw-regular); color: var(--cb-ink-2); font-variant-numeric: tabular-nums; }
.pv-kind[aria-pressed="false"] { color: var(--cb-ink-3); text-decoration: line-through; }
.pv-kind[aria-pressed="false"] .pv-sw { background: transparent; border: 1px solid var(--cb-line-2); }
.pv-kind--static { cursor: default; }
.pv-kind--static:hover { border-color: transparent; }
.pv-sw { flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--cb-key, var(--cb-ink-3)); }
.pv-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pv-chips--end { justify-content: flex-end; }
.pv-chip { min-height: 22px; padding: 1px 9px; border: 1px solid var(--cb-line); border-radius: 10px; background: transparent; color: var(--cb-ink-2); font: 12px/1.4 var(--cb-font-app); white-space: nowrap; cursor: pointer; }
.pv-chip[aria-pressed="true"] { color: var(--cb-ink); border-color: var(--cb-blue); }
.pv-plot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--cb-space-1); }
.pv-chart { position: relative; width: 100%; min-width: 0; }
.pv-chart .cb-chart text.pv-ink { fill: var(--cb-ink-2); }
.pv-cross { stroke: var(--cb-ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.pv-proj { stroke: var(--cb-ink-3); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
.pv-chart .cb-chart text.pv-halo { paint-order: stroke; stroke: var(--cb-surface); stroke-width: 3px; stroke-linejoin: round; fill: var(--cb-ink-2); }
/* the target's label: readable whatever is under it, a halo in the box's background colour, in both themes */
.pv-chart .cb-chart text.pv-tlabel { paint-order: stroke; stroke: var(--cb-surface); stroke-width: 5px; stroke-linejoin: round; fill: var(--cb-ink); font-weight: var(--cb-fw-semibold); }
.pv-bar-hit { fill: transparent; }
.pv-bar-hit:hover { fill: var(--cb-ink); fill-opacity: .07; }
.pv-flag { margin: 0; padding: 4px 10px; border-radius: var(--cb-radius-sm); background: var(--cb-yellow-soft); color: var(--cb-yellow); font-size: var(--cb-fs-xs); font-weight: var(--cb-fw-semibold); }
.pv-empty { padding: var(--cb-space-4); border: 1px dashed var(--cb-line-2); border-radius: var(--cb-radius-md); color: var(--cb-ink-2); font-size: var(--cb-fs-sm); margin: 0; }
.pv-fold { margin: 0; padding: 0 var(--cb-space-1); }
.pv-fold > summary { min-height: 36px; }
.pv-fold-body { display: grid; gap: var(--cb-space-3); padding: 0 0 var(--cb-space-3); }
.pv-made-bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; }
.pv-seg { flex: 0 1 0; min-width: 3px; background: var(--cb-key); }
.pv-made-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--cb-space-1) var(--cb-space-4); font-size: var(--cb-fs-xs); color: var(--cb-ink-2); }
.pv-made-legend li { display: inline-flex; align-items: center; gap: 6px; }
.pv-passes { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--cb-space-2); }
.pv-passes li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--cb-space-3); padding-bottom: var(--cb-space-2); border-bottom: 1px solid var(--cb-line); font-size: 13px; }
.pv-passes li b { font-weight: var(--cb-fw-semibold); overflow-wrap: anywhere; }
.pv-passes .pv-sub { grid-column: 1 / -1; }

/* the road, beside the pick on the Dashboard: one line a step, done in one line */
.pv-road { padding: 10px 0 8px; }
.pv-road .pv-r { min-height: 30px; padding: 4px var(--cb-space-4); font-size: 13px; }
.pv-road .pv-r .pv-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-road .pv-done { padding: 6px var(--cb-space-4) 0; }
.pv-road-note { padding: 4px var(--cb-space-4) 0; }
/* the tree's bar, in view under the code chart */
.pv-made { display: grid; gap: var(--cb-space-2); padding-top: var(--cb-space-3); }
/* the sessions: a row a session, a click unfolds its passes */
.pv-sess { padding: var(--cb-space-3) 0; }
.pv-ses { display: grid; grid-template-columns: 150px minmax(0, 1fr) repeat(4, auto); align-items: baseline; gap: 2px 14px; width: 100%; min-height: 30px; padding: 4px var(--cb-space-4); border: 0; border-top: 1px solid var(--cb-surface-2); background: transparent; color: var(--cb-ink); font: 13px/1.35 var(--cb-font-app); text-align: left; cursor: pointer; }
.pv-ses:hover { background: var(--cb-surface-2); }
.pv-ses:focus-visible { outline: var(--cb-focus-ring); outline-offset: var(--cb-focus-offset); }
.pv-ses .pv-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-ses .pv-n { font-variant-numeric: tabular-nums; font-size: var(--cb-fs-xs); color: var(--cb-ink-2); white-space: nowrap; text-align: right; }
.pv-ses .pv-n b { font-weight: var(--cb-fw-semibold); color: var(--cb-ink); }
.pv-ses-head { cursor: default; }
.pv-ses-head:hover { background: transparent; }
.pv-ses-head > span { font-size: 11px; color: var(--cb-ink-2); }
.pv-ses-kids { padding: 4px var(--cb-space-4) var(--cb-space-3) 180px; }
.pv-sess-end { margin: 6px var(--cb-space-4) 0; }
/* the three figures: the same gap as the code box's between "lines today" and "+n this week" */
.pv-figs { display: flex; flex-direction: column; gap: var(--cb-space-2); }
.pv-fig-k { margin: 0 0 var(--cb-space-1); font-size: var(--cb-fs-xs); color: var(--cb-ink-3); }
.pv-r { display: flex; align-items: baseline; gap: 14px; min-height: 46px; padding: 6px 18px; border-top: 1px solid var(--cb-surface-2); font-size: var(--cb-fs-sm); color: var(--cb-ink); }
.pv-r:first-child { border-top: 0; }
.pv-r--quiet { color: var(--cb-ink-2); }
.pv-w { flex: none; width: 52px; font: var(--cb-fw-semibold) var(--cb-fs-xs)/1.4 var(--cb-font-app); color: var(--cb-ink-2); }
.pv-w--now { color: var(--cb-blue); }
.pv-yours { display: block; font-size: var(--cb-fs-xs); color: var(--cb-orange); }
.pv-done { margin: 0; padding: 0 var(--cb-space-1); font-size: 12.5px; color: var(--cb-ink-2); }
.pv-done .pv-more { color: var(--cb-ink-2); font-size: 12.5px; }
.pv-done-list { list-style: none; margin: var(--cb-space-2) 0 0; padding: 0; display: grid; gap: var(--cb-space-1); }

/* the footer, the theme */
.pv-foot { margin-top: var(--cb-space-5); display: flex; flex-wrap: wrap; align-items: center; gap: var(--cb-space-2) var(--cb-space-4); padding: var(--cb-space-3) var(--cb-space-4); border: 1px dashed var(--cb-line-2); border-radius: var(--cb-radius-md); color: var(--cb-ink-2); font-size: var(--cb-fs-xs); }
.pv-foot p { margin: 0; flex: 1 1 320px; }
.cb-seg { display: inline-flex; padding: 2px; border-radius: var(--cb-radius-pill); background: var(--cb-surface-2); box-shadow: var(--cb-shadow-seg); }
.cb-seg-item { min-height: 26px; padding: 2px 10px; border: 0; border-radius: var(--cb-radius-pill); background: transparent; color: var(--cb-ink-2); font: var(--cb-fw-semibold) var(--cb-fs-xs)/1.4 var(--cb-font-app); cursor: pointer; }
.cb-seg-item[aria-pressed="true"] { background: var(--cb-ink); color: var(--cb-bg); }
.cb-seg-item:focus-visible { outline: var(--cb-focus-ring); outline-offset: var(--cb-focus-offset); }

@media (max-width: 900px) {
  .pv { padding: var(--cb-space-5) var(--cb-space-4) var(--cb-space-8); }
  .pv-row2, .pv-split, .pv-two { grid-template-columns: minmax(0, 1fr); }
  .pv-gt { flex-direction: column; }
  .pv-side { width: auto; }
  .pv-ses { grid-template-columns: minmax(0, 1fr) auto; }
  .pv-ses-kids { padding-left: var(--cb-space-4); }
}
@media print {
  .cb-tip { display: none !important; }
  body { background: var(--cb-print-bg); }
}
</style>
</head>
<body>
<main class="pv">
  <!-- The head, above the tabs: the project's name and the gate in one line; the branch and when the page was made; the
       refresh icon, hidden unless a host (the extension's tab) gives window.lorisseHost.refresh.
       Fills from: project, gate, branch, pushed, generated -->
  <header class="pv-top">
    <svg class="pv-eye" id="eye" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g fill="none" stroke-width="7"><circle class="pv-eye-on" cx="32" cy="32" r="26" stroke-dasharray="37 126.4" transform="rotate(-135 32 32)"/><circle class="pv-eye-on" cx="32" cy="32" r="26" stroke-dasharray="37 126.4" transform="rotate(-45 32 32)"/><circle class="pv-eye-off" cx="32" cy="32" r="26" stroke-dasharray="37 126.4" transform="rotate(45 32 32)"/><circle class="pv-eye-off" cx="32" cy="32" r="26" stroke-dasharray="37 126.4" transform="rotate(135 32 32)"/></g><circle class="pv-eye-pupil" cx="32" cy="32" r="11"/></svg>
    <h1 id="title"></h1>
    <span class="pv-gate" id="gate"></span>
    <span class="pv-grow"></span>
    <span class="pv-meta" id="meta"></span>
    <button class="pv-refresh" id="refresh" type="button" title="Refresh the page" aria-label="Refresh the page" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9H15"/></svg></button>
  </header>

  <!-- The tabs (2026-11-19, the owner's canvas): the chosen one is the URL's #name; the part chosen on Parts follows it -->
  <div class="pv-tabs" id="tabs" role="tablist" aria-label="The page">
    <button class="pv-tab" type="button" role="tab" id="tab-dashboard" data-tab="dashboard" aria-controls="panel-dashboard" aria-selected="true">Dashboard</button>
    <button class="pv-tab" type="button" role="tab" id="tab-parts" data-tab="parts" aria-controls="panel-parts" aria-selected="false" tabindex="-1">Parts</button>
    <button class="pv-tab" type="button" role="tab" id="tab-growth" data-tab="growth" aria-controls="panel-growth" aria-selected="false" tabindex="-1">Growth and tokens</button>
  </div>

  <!-- Dashboard (the canvas, 2026-11-20): the parts where each one stands; under it, side by side, the agent's pick (the
       road file's moves, then the pages to read) and the road.

  for (const b of bins) { b.v = layers.map((l) => rows.filter((r) => l.has(r) && day(r[0]) >= b.from && day(r[0]) < b.to).reduce((s, r) => s + tokVal(r), 0)); b.total = b.v.reduce((s, x) => s + x, 0); }

  const max = Math.max(tok.unit === "usd" ? 1 : 1000, ...bins.map((b) => b.total));
  const svg = sv("svg", { class: "cb-chart", width: W, height: H, viewBox: `0 0 ${W} ${H}` }, box);
  const y = (v) => T + ph - (v * ph) / (max * 1.08);
  const step = niceStep(max * 1.08, 4);
  for (let v = 0; v <= max * 1.08; v += step) {
    sv("line", { class: v === 0 ? "cb-chart-base" : "cb-chart-grid", x1: L, x2: L + pw, y1: y(v), y2: y(v) }, svg);
    sv("text", { x: L - 6, y: y(v) + 3, "text-anchor": "end" }, svg).textContent = tok.unit === "usd" ? usd(v) : mega(v);
  }
  const slot = pw / Math.max(1, bins.length), bw = Math.max(2, Math.min(64, slot * 0.7));
  const every = Math.max(1, Math.ceil(bins.length / Math.max(2, Math.floor(pw / 64))));
  bins.forEach((b, i) => {
    const cx = L + slot * i + slot / 2;
    let base = 0;
    b.v.forEach((v, j) => {
      if (!v) return;
      sv("rect", { x: cx - bw / 2, y: y(base + v), width: bw, height: Math.max(1, y(base) - y(base + v)), style: `fill: var(${layers[j].color})` }, svg);
      base += v;
    });
    if (bins.length <= 14 && b.total) sv("text", { x: cx, y: y(b.total) - 4, "text-anchor": "middle", class: "pv-ink" }, svg).textContent = tok.unit === "usd" ? usd(b.total) : mega(b.total);
    if (i % every === 0) sv("text", { x: cx, y: H - 6, "text-anchor": "middle" }, svg).textContent = dm(b.from);
    const hit = sv("rect", { class: "pv-bar-hit", x: L + slot * i, y: T, width: slot, height: ph }, svg);
    const text = [b.week ? `Week of ${dm(b.from)}` : `${WEEKDAYS[b.from.getDay()]} ${dm(b.from)}`, `${tokSay(b.total)} in all`].concat(layers.map((l, j) => `${l.name}: ${tokSay(b.v[j])}`)).join("\n");
    hover(hit, text, i > bins.length / 2);
  });
}
// ── the sessions (C-8.11): tokens.sessions[{start, end, day, part, subject, from, passes, pass_usd, thread_usd, usd,
//    items[[ended, pass, model, minutes, tokens, in, out, usd, here]]}], newest first, as the generator cut them at an
//    hour's pause; twenty shown, then "older sessions"; a click unfolds a session's passes, each drawn as a pass ──
const SESSIONS_SHOWN = 20;
let sessAll = false;
const sessOpen = new Set();
/** A pass, one line: its name, its minutes, then when, its model, its tokens and dollars, or "no record". */
function passLi([ended, name, model, minutes, , pin, pout, pusd]) {
  const cost = pusd == null ? "no record" : `in ${mega(pin)} · out ${mega(pout)} · ${usd(pusd)}`;
  const li = el("li"); li.append(el("b", "", name), el("span", "pv-m", `${minutes} min`), el("span", "pv-sub", `${when(ended)} · ${modelName(model)} · ${cost}`));
  return li;
}
function renderSessions() {
  const box = clear("sessions"), t = D.tokens;
  if (!t || !t.transcripts) { box.appendChild(el("p", "pv-hint pv-sess-end", t && t.failed ? "The token logs could not be read." : "No transcripts here.")); return; }
  const ss = t.sessions;
  if (!Array.isArray(ss)) { box.appendChild(el("p", "pv-hint pv-sess-end", "The sessions need the hour of each message: this token log is older and has none; page/usage.ps1 run again writes it.")); return; }
  if (!ss.length) { box.appendChild(el("p", "pv-hint pv-sess-end", "No session recorded for this project.")); return; }
  const head = el("div", "pv-ses pv-ses-head");
  head.append(el("span", "", "when"), el("span", "", "subject"), el("span", "pv-n", "passes"), el("span", "pv-n", "the passes"), el("span", "pv-n", "the thread"), el("span", "pv-n", "together"));
  box.appendChild(head);
  for (const s of sessAll ? ss : ss.slice(0, SESSIONS_SHOWN)) {
    const open = sessOpen.has(s.start), b = el("button", "pv-ses"); b.type = "button"; b.setAttribute("aria-expanded", String(open));
    const subj = el("span", `pv-nm${s.subject ? "" : " pv-q"}`, s.subject || "the thread alone, no pass"); subj.title = `${s.subject || ""}${s.from === "passes" ? "\n(its passes' names: no subject in the road file's sessions:)" : ""}\n${when(s.start)} to ${String(s.end || "").slice(11, 16)}`;
    const tot = el("span", "pv-n"); tot.appendChild(el("b", "", usd(Number(s.usd || 0))));
    b.append(el("span", "", `${open ? "▾" : "▸"} ${dmy(s.day)} · ${s.part}`), subj, el("span", "pv-n", plural(Number(s.passes || 0), "pass")), el("span", "pv-n", usd(Number(s.pass_usd || 0))), el("span", "pv-n", usd(Number(s.thread_usd || 0))), tot);
    b.addEventListener("click", () => { if (sessOpen.has(s.start)) sessOpen.delete(s.start); else sessOpen.add(s.start); renderSessions(); });
    box.appendChild(b);
    if (open) {
      const kid = el("div", "pv-ses-kids"), items = (s.items || []).slice().sort((a, c) => (a[0] < c[0] ? 1 : -1));
      if (!items.length) kid.appendChild(el("p", "pv-hint", "No pass in this session: the thread alone."));
      else { const ul = el("ul", "pv-passes"); for (const p of items) ul.appendChild(passLi(p)); kid.appendChild(ul); }
      box.appendChild(kid);
    }
  }
  if (!sessAll && ss.length > SESSIONS_SHOWN) { const m = el("button", "pv-more pv-sess-end", `older sessions · ${ss.length - SESSIONS_SHOWN}`); m.type = "button"; m.addEventListener("click", () => { sessAll = true; renderSessions(); }); box.appendChild(m); }
  box.appendChild(el("p", "pv-hint pv-sess-end", "A session is a stretch of work with no pause over an hour, the thread's messages and its passes' together; its subject is the one the road file's sessions: gives it, else its passes' names."));
}

// ── the road, on the Dashboard beside the pick (C-9.5): road[{state, step, when, yours}], road_note, as the road file
//    writes it: the step under way with "since <date>", two next, two later, one line each; then everything done on one
//    line, "Done · n steps, <first> to <last>", nothing unfolding ──
const ROAD_GROUPS = [["now", "Now", 1], ["next", "Next", 2], ["later", "Later", 2]];
const datesIn = (s) => (String(s || "").match(/\d{4}-\d{2}-\d{2}/g) || []);
function renderRoad() {
  const ol = clear("road"), road = D.road || [], done = clear("done");
  $("road-note").textContent = D.road_note || "";
  if (!road.length) { ol.appendChild(el("li", "pv-r pv-q", "No road written yet: road.yaml holds the steps, in order.")); return; }
  for (const [state, word, n] of ROAD_GROUPS) {
    for (const s of road.filter((x) => x.state === state).slice(0, n)) {
      const li = el("li", `pv-r${state === "later" ? " pv-r--quiet" : ""}`);
      li.appendChild(el("span", `pv-w${state === "now" ? " pv-w--now" : ""}`, word));
      const nm = el("span", "pv-nm", s.step); nm.title = `${s.step}${s.yours ? `\nyours: ${s.yours}` : ""}`; li.appendChild(nm);
      const ds = datesIn(s.when);
      if (ds.length) li.appendChild(el("span", "pv-t", state === "now" ? `since ${dmy(ds[0])}` : ds.map(dmy).join(" – ")));
      ol.appendChild(li);
    }
  }
  const ds = road.filter((s) => s.state === "done"), dd = ds.flatMap((s) => datesIn(s.when)).sort();
  if (ds.length) done.textContent = `Done · ${plural(ds.length, "step")}${dd.length ? `, ${dmLong(dd[0])}${dd.length > 1 && dd[dd.length - 1] !== dd[0] ? ` to ${dmLong(dd[dd.length - 1])}` : ""}` : ""}`;
}

// ── the tabs: Dashboard, Parts, Growth and tokens; the chosen one is the URL's #name (#parts/<part> keeps the part); an
//    address of a tab the page no longer has (#road, #next, #now) opens the Dashboard ──
const TABS = ["dashboard", "parts", "growth"];
const OLD_TAB = { now: "dashboard", next: "dashboard", road: "dashboard" };
let tabShown = "dashboard";
const tabOf = (h) => { const t = String(h || "").replace(/^#/, "").split("/")[0]; const n = OLD_TAB[t] || t; return TABS.includes(n) ? n : "dashboard"; };
const partOf = (h) => { const m = /^#?parts\/(.+)$/.exec(String(h || "")); return m ? decodeURIComponent(m[1]) : ""; };
function setHash(h) {
  if (location.hash === `#${h}`) return;
  // replaceState keeps the place without a jump; where it is refused, the hash itself
  try { history.replaceState(null, "", `#${h}`); } catch (e) { try { location.hash = h; } catch (e2) { /* a view without a URL */ } }
}
/** Show one tab: its button selected and in the Tab order, its panel shown, the others hidden; the hash follows. */
function showTab(name, focus, keep) {
  tabShown = tabOf(name);
  for (const t of TABS) {
    const b = $(`tab-${t}`), p = $(`panel-${t}`), on = t === tabShown;
    b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; p.hidden = !on;
  }
  if (focus) $(`tab-${tabShown}`).focus();
  if (keep) setHash(tabShown === "parts" && chosen ? `parts/${chosen}` : tabShown);
  // a chart is sized on show, never in a hidden panel (its width is 0 there)
  drawCharts();
}
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab, false, true); });
$("tabs").addEventListener("keydown", (e) => {
  const i = TABS.indexOf(tabShown), k = e.key;
  const j = k === "ArrowRight" ? (i + 1) % TABS.length : k === "ArrowLeft" ? (i + TABS.length - 1) % TABS.length : k === "Home" ? 0 : k === "End" ? TABS.length - 1 : -1;
  if (j < 0) return;
  e.preventDefault(); showTab(TABS[j], true, true);
});
window.addEventListener("hashchange", () => {
  const p = partOf(location.hash);
  if (p && p !== chosen && (D.parts || []).some((x) => x.name === p)) choose(p, false);
  if (tabOf(location.hash) !== tabShown) showTab(location.hash, false, false);
});

function drawCharts() { if (!D || tabShown !== "growth") return; drawArea(); drawTokens(); }
function render() {
  renderHead(); renderRefresh(); renderGrid(); renderPick(); renderRoad();
  const p = partOf(location.hash);
  chosen = p && (D.parts || []).some((x) => x.name === p) ? p : defaultPart();
  renderPartList(); renderPart();
  renderCode(); renderMade(); renderTokens(); renderSessions();
  showTab(location.hash, false, false);
}
function load() {
  try { D = JSON.parse($("data").textContent); } catch (e) { D = { project: { name: "Cannot read the data" }, generated: "", road: [], parts: [], sources: String(e.message || e) }; }
  setAreas();
  try { const v = JSON.parse(stored("pv-off") || "[]"); offKinds = new Set(Array.isArray(v) ? v.map(String).filter((a) => AREAS.includes(a)) : []); } catch (e) { offKinds = new Set(); }
  try { const v = JSON.parse(stored("pv-fam") || "[]"); famOpen = new Set(Array.isArray(v) ? v.map(String) : []); } catch (e) { famOpen = new Set(); }
  from = stored("pv-from") || "all"; if (!FROM_PICKS.some((p) => p[0] === from)) from = "all";
  // the tokens' two switches and range, kept for the project as the code's range is (C-8.10)
  const tv = stored("pv-tok-view"), tu = stored("pv-tok-unit"), tr = stored("pv-tok-range");
  if (TOK_VIEWS.some((x) => x[0] === tv)) tok.view = tv;
  if (tu === "usd" || tu === "tokens") tok.unit = tu;
  if (TOK_RANGES.some((x) => x[0] === tr)) tok.range = tr;
  render();
}
// The theme: Auto follows the system; Light and Dark are remembered in this browser only.
const theme = $("theme");
function setTheme(v, save) {
  if (v === "light" || v === "dark") document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme");
  theme.querySelectorAll("[data-value]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === v)));
  if (save) { try { localStorage.setItem("pv-theme", v); } catch (e) { /* storage may be off */ } }
  if (D) drawCharts();
}
theme.addEventListener("click", (e) => { const b = e.target.closest("[data-value]"); if (b) setTheme(b.dataset.value, true); });
let saved = "auto"; try { saved = localStorage.getItem("pv-theme") || "auto"; } catch (e) { /* storage may be off */ }
setTheme(new URLSearchParams(location.search).get("theme") || saved, false);
load();
// a host may set its object after the script ran: look again once the page has loaded
window.addEventListener("load", () => { renderRefresh(); renderPart(); });
let pending = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(drawCharts); });
</script>
</body>
